<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 790" width="1015" height="790" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <style>
      .band-label { font-size: 15px; font-weight: 700; fill: #2D3748; text-anchor: middle; }
      .group-title { font-size: 13px; font-weight: 700; fill: #4A5568; text-anchor: middle; }
      .box { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.2; }
      .box-strong { fill: #FFFFFF; stroke: #2B6CB0; stroke-width: 2; }
      .box-dashed { fill: #FFFFFF; stroke: #A0AEC0; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .group { fill: none; stroke: #CBD5E0; stroke-width: 1; stroke-dasharray: 3 3; }
      .chip { fill: #EBF4FF; stroke: #90CDF4; stroke-width: 1; }
      .t { font-size: 14px; font-weight: 700; fill: #1A202C; text-anchor: middle; }
      .s { font-size: 12px; fill: #4A5568; text-anchor: middle; }
      .c { font-size: 12px; fill: #2A4365; }
      .a { stroke: #4A5568; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .al { font-size: 11px; fill: #4A5568; }
    </style>
  </defs>

  <!-- 1. 호출하는 쪽 -->
  <rect x="20" y="20" width="975" height="160" rx="8" fill="#F7FAFC" stroke="#E2E8F0"/>
  <rect x="20" y="20" width="120" height="160" rx="8" fill="#EDF2F7"/>
  <text class="band-label" x="80" y="96">호출하는 쪽</text>

  <rect class="group" x="160" y="32" width="460" height="136" rx="6"/>
  <text class="group-title" x="390" y="54">Agent 개발자의 코드</text>
  <rect class="box" x="170" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="240" y="96">Agent 호출</text>
  <text class="s" x="240" y="118">run · stream · resume</text>
  <text class="s" x="240" y="137">응용 서버에서 호출</text>
  <rect class="box" x="320" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="390" y="96">그래프 빌더</text>
  <text class="s" x="390" y="118">노드와 에지 등록</text>
  <text class="s" x="390" y="137">compile로 구조 검사</text>
  <rect class="box" x="470" y="66" width="140" height="90" rx="6"/>
  <text class="t" x="540" y="96">도구 등록</text>
  <text class="s" x="540" y="118">도구와 메타데이터</text>
  <text class="s" x="540" y="137">등급 · 권한 · undo</text>

  <rect class="group" x="640" y="32" width="340" height="136" rx="6"/>
  <text class="group-title" x="810" y="54">응답을 보내는 쪽</text>
  <rect class="box" x="650" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="700" y="104">사용자</text>
  <text class="s" x="700" y="124">추가 입력</text>
  <text class="s" x="700" y="141">본인 확인</text>
  <rect class="box" x="760" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="810" y="104">승인자</text>
  <text class="s" x="810" y="126">승인, 반려</text>
  <rect class="box" x="870" y="66" width="100" height="90" rx="6"/>
  <text class="t" x="920" y="104">외부 시스템</text>
  <text class="s" x="920" y="126">콜백, 이벤트</text>

  <!-- 2. 실행기 -->
  <rect x="20" y="200" width="975" height="250" rx="8" fill="#F0F6FC" stroke="#BEE3F8"/>
  <rect x="20" y="200" width="120" height="250" rx="8" fill="#E1EEFA"/>
  <text class="band-label" x="80" y="318">실행기</text>
  <text class="s" x="80" y="338">(라이브러리)</text>

  <rect class="box-strong" x="160" y="215" width="280" height="220" rx="6"/>
  <text class="t" x="300" y="240">핵심 루프</text>
  <text class="s" x="300" y="258">노드 하나마다 아래를 반복</text>
  <rect class="chip" x="180" y="270" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="288">① 노드 실행</text>
  <rect class="chip" x="180" y="303" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="321">② 변경분을 State에 합치기</text>
  <rect class="chip" x="180" y="336" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="354">③ 에지를 평가해 다음 노드 고르기</text>
  <rect class="chip" x="180" y="369" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="387">④ 예산 검사</text>
  <rect class="chip" x="180" y="402" width="240" height="26" rx="4"/>
  <text class="c" x="192" y="420">⑤ 체크포인트 저장 (pause면 멈춤)</text>

  <rect class="box" x="480" y="215" width="310" height="90" rx="6"/>
  <text class="t" x="635" y="245">응답 접수</text>
  <text class="s" x="635" y="267">resume의 입구</text>
  <text class="s" x="635" y="286">run_id로 멈춘 run을 찾아 깨움</text>

  <rect class="box-dashed" x="820" y="215" width="160" height="90" rx="6"/>
  <text class="t" x="900" y="240">만료 점검기</text>
  <text class="s" x="900" y="261">유일한 배경 작업</text>
  <text class="s" x="900" y="279">기한이 지난 대기를</text>
  <text class="s" x="900" y="296">만료 응답으로 깨움</text>

  <rect class="box" x="480" y="325" width="310" height="110" rx="6"/>
  <text class="t" x="635" y="352">미들웨어 체인</text>
  <text class="s" x="635" y="375">노드 실행, 모델 호출, 도구 호출을 감쌈</text>
  <text class="s" x="635" y="395">플랫폼 필수: 추적, 권한, 승인 확인, 영수증 번호</text>
  <text class="s" x="635" y="414">+ Agent 개발자 추가 묶음</text>

  <rect class="box" x="820" y="325" width="160" height="110" rx="6"/>
  <text class="t" x="900" y="360">추적과 비용 수집</text>
  <text class="s" x="900" y="383">호출마다 시간과 토큰</text>
  <text class="s" x="900" y="402">run 단위로 합산</text>

  <!-- 3. 인터페이스와 어댑터 -->
  <rect x="20" y="470" width="975" height="150" rx="8" fill="#F3F8F1" stroke="#C6E2C0"/>
  <rect x="20" y="470" width="120" height="150" rx="8" fill="#E5F1E1"/>
  <text class="band-label" x="80" y="540">인터페이스와</text>
  <text class="band-label" x="80" y="560">어댑터</text>

  <rect class="group" x="160" y="482" width="280" height="126" rx="6"/>
  <text class="group-title" x="300" y="502">저장소 인터페이스</text>
  <rect class="box" x="172" y="514" width="122" height="40" rx="5"/>
  <text class="s" x="233" y="538" font-weight="700" fill="#1A202C">그래프 레지스트리</text>
  <rect class="box" x="306" y="514" width="122" height="40" rx="5"/>
  <text class="s" x="367" y="538" font-weight="700" fill="#1A202C">도구 레지스트리</text>
  <rect class="box" x="172" y="562" width="122" height="40" rx="5"/>
  <text class="s" x="233" y="586" font-weight="700" fill="#1A202C">체크포인트 저장소</text>
  <rect class="box" x="306" y="562" width="122" height="40" rx="5"/>
  <text class="s" x="367" y="586" font-weight="700" fill="#1A202C">세션 저장소</text>

  <rect class="box" x="480" y="482" width="240" height="126" rx="6"/>
  <text class="t" x="600" y="514">모델 어댑터</text>
  <text class="s" x="600" y="540">모델 별칭을 실제 모델로</text>
  <text class="s" x="600" y="560">구조화 출력 강제</text>
  <text class="s" x="600" y="580">재시도와 폴백</text>

  <rect class="box" x="740" y="482" width="240" height="126" rx="6"/>
  <text class="t" x="860" y="514">도구 어댑터</text>
  <text class="s" x="860" y="540">시간 제한과 재시도</text>
  <text class="s" x="860" y="560">호출량 제한</text>
  <text class="s" x="860" y="580">외부 시스템 호출</text>

  <!-- 4. 구현과 외부 시스템 -->
  <rect x="20" y="640" width="975" height="130" rx="8" fill="#FAF6F0" stroke="#E8DCC8"/>
  <rect x="20" y="640" width="120" height="130" rx="8" fill="#F3EADC"/>
  <text class="band-label" x="80" y="700">구현과</text>
  <text class="band-label" x="80" y="720">외부 시스템</text>

  <rect class="box" x="160" y="655" width="280" height="100" rx="6"/>
  <text class="t" x="300" y="686">저장소 구현</text>
  <text class="s" x="300" y="710">관계형 DB, 문서 DB, 키-값 저장소,</text>
  <text class="s" x="300" y="729">파일, 메모리 가운데 선택</text>

  <rect class="box" x="480" y="655" width="240" height="100" rx="6"/>
  <text class="t" x="600" y="696">모델 제공자</text>
  <text class="s" x="600" y="720">사내외 LLM</text>

  <rect class="box" x="740" y="655" width="240" height="100" rx="6"/>
  <text class="t" x="860" y="696">업무 시스템</text>
  <text class="s" x="860" y="720">사내 API, 데이터베이스, 외부 서비스</text>

  <!-- 화살표 -->
  <path class="a" d="M240,157 L240,213"/>
  <text class="al" x="248" y="194">run</text>
  <path class="a" d="M715,169 L715,213"/>
  <text class="al" x="723" y="194">응답</text>

  <path class="a" d="M480,260 L442,260"/>
  <text class="al" x="445" y="252">resume</text>
  <path class="a" d="M820,260 L792,260"/>

  <path class="a" d="M440,380 L478,380"/>
  <path class="a" d="M790,380 L818,380"/>

  <path class="a" d="M300,435 L300,480"/>
  <text class="al" x="308" y="464">읽고 쓰기</text>
  <path class="a" d="M600,435 L600,480"/>
  <text class="al" x="608" y="464">model.call</text>
  <path class="a" d="M760,435 L760,480"/>
  <text class="al" x="768" y="464">tools.call</text>

  <path class="a" d="M300,608 L300,653"/>
  <path class="a" d="M600,608 L600,653"/>
  <path class="a" d="M860,608 L860,653"/>
</svg>
